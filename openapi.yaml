openapi: 3.0.3
info:
  title: API магазина
  version: 1.0.0
  description: Документация соответствует текущей реализации сервера. Данные из базы могут содержать дополнительные
    поля.
servers:
- url: http://localhost:3000
  description: Локальный сервер
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Вход
      description: Без авторизации.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
        '500':
          description: Внутренняя ошибка сервера
        '400':
          description: Некорректный запрос
  /auth/register:
    post:
      tags:
      - auth
      summary: Регистрация
      description: Без авторизации.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '500':
          description: Внутренняя ошибка сервера
        '400':
          description: Некорректный запрос
  /auth/register-simple:
    post:
      tags:
      - auth
      summary: Регистрация без обёртки
      description: Без авторизации.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
        '500':
          description: Внутренняя ошибка сервера
        '400':
          description: Некорректный запрос
  /auth/validate-token:
    get:
      tags:
      - auth
      summary: Проверка и обновление токена
      description: Требуется токен.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
        '500':
          description: Внутренняя ошибка сервера
        '401':
          description: Токен отсутствует
        '403':
          description: Токен недействителен или недостаточно прав
  /cart:
    get:
      tags:
      - cart
      summary: Получить корзину
      description: Требуется токен.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart: &id001
                    type: object
                    additionalProperties: true
                additionalProperties: true
        '500':
          description: Внутренняя ошибка сервера
        '401':
          description: Токен отсутствует
        '403':
          description: Токен недействителен или недостаточно прав
  /cart/items:
    post:
      tags:
      - cart
      summary: Добавить товар в корзину
      description: Требуется токен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItem'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart_item: *id001
                additionalProperties: true
        '500':
          description: Внутренняя ошибка сервера
        '401':
          description: Токен отсутствует
        '403':
          description: Токен недействителен или недостаточно прав
        '400':
          description: Некорректный запрос
  /cart/items/{cart_item_id}:
    put:
      tags:
      - cart
      summary: Изменить количество
      description: Требуется токен.
      parameters:
      - name: cart_item_id
        in: path
        required: true
        schema:
          type: integer
        description: Идентификатор.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quantity'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart_item: *id001
                additionalProperties: true
        '500':
          description: Внутренняя ошибка сервера
        '401':
          description: Токен отсутствует
        '403':
          description: Токен недействителен или недостаточно прав
        '400':
          description: Некорректный запрос
        '404':
          description: Объект не найден
    delete:
      tags:
      - cart
      summary: Удалить товар из корзины
      description: Требуется токен.
      parameters:
      - name: cart_item_id
        in: path
        required: true
        schema:
          type: integer
        description: Идентификатор.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: &id002
                    type: string
                additionalProperties: true
        '500':
          description: Внутренняя ошибка сервера
        '401':
          description: Токен отсутствует
        '403':
          description: Токен недействителен или недостаточно прав
        '400':
          description: Некорректный запрос
        '404':
          description: Объект не найден
  /cart/clear:
    delete:
      tags:
      - cart
      summary: Очистить корзину
      description: Требуется токен.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
