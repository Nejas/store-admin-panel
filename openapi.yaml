  schemas:
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
      - email
      - password
    Registration:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        phone:
          type: string
      required:
      - firstName
      - lastName
      - email
      - password
    UserInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        phone:
          type: string
        role:
          type: string
        department:
          type: string
        position:
          type: string
        hire_date:
          type: string
    Address:
      type: object
      properties:
        address_type:
          type: string
        is_default_shipping:
          type: boolean
        recipient_name:
          type: string
        recipient_phone:
          type: string
        country:
          type: string
        region:
          type: string
        city:
          type: string
        district:
          type: string
        postal_code:
          type: string
        street:
          type: string
        house:
          type: string
        building:
          type: string
        apartment:
          type: string
        entrance:
          type: string
        floor:
          type: string
        intercom:
          type: string
        landmark:
          type: string
        delivery_instructions:
          type: string
        is_active:
          type: boolean
