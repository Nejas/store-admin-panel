        '500':
          description: Внутренняя ошибка сервера
        '401':
          description: Токен отсутствует
        '403':
          description: Токен недействителен или недостаточно прав
  /products:
    get:
      tags:
      - products
      summary: Список товаров
      description: Требуется токен.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      - name: search
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: *id001
                additionalProperties: true
        '500':
          description: Внутренняя ошибка сервера
        '401':
          description: Токен отсутствует
        '403':
          description: Токен недействителен или недостаточно прав
    post:
      tags:
      - products
      summary: Создать товар
      description: 'Доступ: admin или manager.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: *id001
                additionalProperties: true
        '500':
          description: Внутренняя ошибка сервера
        '401':
          description: Токен отсутствует
        '403':
          description: Токен недействителен или недостаточно прав
        '400':
          description: Некорректный запрос
  /products/{id}:
    get:
      tags:
      - products
      summary: Получить товар
      description: Требуется токен.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Идентификатор.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: *id001
                additionalProperties: true
        '500':
          description: Внутренняя ошибка сервера
        '401':
          description: Токен отсутствует
        '403':
          description: Токен недействителен или недостаточно прав
        '404':
