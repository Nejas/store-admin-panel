        '404':
          description: Объект не найден
    put:
      tags:
      - orders
      summary: Изменить данные заказа
      description: 'Доступ: admin или manager.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Успешно
        '400':
          description: Некорректные данные или вариант используется
        '401':
          description: Токен отсутствует
        '403':
          description: Недостаточно прав
        '404':
          description: Не найдено
        '500':
          description: Ошибка сервера
      requestBody:
        required: true
        content:
