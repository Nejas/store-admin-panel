        '500':
          description: Внутренняя ошибка сервера
        '401':
          description: Токен отсутствует
        '403':
          description: Токен недействителен или недостаточно прав
        '400':
          description: Некорректный запрос
  /cart/check-availability:
    get:
      tags:
      - cart
      summary: Проверить наличие
      description: Требуется токен.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
